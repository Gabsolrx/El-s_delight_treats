<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E5DDD3"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="marbleTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8F6F4"/>
      <stop offset="70%" stop-color="#EDE8E2"/>
      <stop offset="100%" stop-color="#DFD8CE"/>
    </linearGradient>

    <!-- Gold Foil Metallic Shading -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C068"/>
      <stop offset="25%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#C9982E"/>
      <stop offset="75%" stop-color="#F7E298"/>
      <stop offset="100%" stop-color="#9E731B"/>
    </linearGradient>

    <!-- Deep Gold Metallic for Balls -->
    <radialGradient id="goldSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9DB"/>
      <stop offset="25%" stop-color="#F3D37A"/>
      <stop offset="60%" stop-color="#BF8D2C"/>
      <stop offset="90%" stop-color="#845A12"/>
      <stop offset="100%" stop-color="#543806"/>
    </radialGradient>

    <!-- Glossy White Sphere -->
    <radialGradient id="whiteSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDFBF9"/>
      <stop offset="75%" stop-color="#E2DCD5"/>
      <stop offset="100%" stop-color="#B8B0A6"/>
    </radialGradient>

    <!-- Cake Drum Shading -->
    <linearGradient id="cakeDrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBE7E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDD7CE"/>
    </linearGradient>

    <!-- Cake Body Shading -->
    <linearGradient id="cakeSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAE5DE"/>
      <stop offset="20%" stop-color="#FAF8F5"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F6F2EC"/>
      <stop offset="100%" stop-color="#DFD7CB"/>
    </linearGradient>

    <!-- Cake Top Shading -->
    <radialGradient id="cakeTop" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF7F2"/>
      <stop offset="90%" stop-color="#EEE8E0"/>
      <stop offset="100%" stop-color="#DFD8CD"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5C4533" flood-opacity="0.18"/>
    </filter>
    <filter id="sphereShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#3B2A1E" flood-opacity="0.25"/>
    </filter>
    <filter id="topperGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#875F13" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Kitchen/Studio Tile Seam -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#DDD6CC" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <rect x="0" y="380" width="800" height="620" fill="url(#marbleTable)"/>
  
  <!-- Marble Veins on Tabletop -->
  <path d="M-50,650 Q200,620 450,750 T850,780" fill="none" stroke="#D3C9BD" stroke-width="2.5" opacity="0.45"/>
  <path d="M100,880 Q320,830 550,910 T900,890" fill="none" stroke="#D3C9BD" stroke-width="1.8" opacity="0.35"/>

  <!-- Cake Ambient Table Shadow -->
  <ellipse cx="400" cy="800" rx="310" ry="85" fill="#4A3B30" opacity="0.16" filter="url(#shadowFilter)"/>
  <ellipse cx="400" cy="790" rx="275" ry="60" fill="#2E2117" opacity="0.12"/>

  <!-- White Round Cake Drum / Board -->
  <g id="cakeBoard">
    <path d="M 120,740 C 120,685 680,685 680,740 L 680,765 C 680,820 120,820 120,765 Z" fill="url(#cakeDrum)" stroke="#D8D1C7" stroke-width="1.5"/>
    <ellipse cx="400" cy="740" rx="280" ry="65" fill="#FAF8F5" stroke="#E5DEC9" stroke-width="1"/>
    
    <!-- Gold Speckles on Board Rim -->
    <circle cx="170" cy="745" r="2.5" fill="#C9982E" opacity="0.75"/>
    <circle cx="210" cy="765" r="3" fill="#BF8D2C" opacity="0.7"/>
    <circle cx="290" cy="785" r="2" fill="#E5C068" opacity="0.8"/>
    <circle cx="380" cy="795" r="3" fill="#C9982E" opacity="0.85"/>
    <circle cx="480" cy="790" r="2.5" fill="#BF8D2C" opacity="0.75"/>
    <circle cx="560" cy="775" r="3.5" fill="#E5C068" opacity="0.8"/>
    <circle cx="630" cy="745" r="2.5" fill="#C9982E" opacity="0.75"/>
  </g>

  <!-- Cake Body Cylinder (Single-tier tall round) -->
  <g id="cakeBody" filter="url(#shadowFilter)">
    <!-- Side Wall -->
    <path d="M 155,480 C 155,420 645,420 645,480 L 645,720 C 645,780 155,780 155,720 Z" fill="url(#cakeSide)"/>
    
    <!-- Top Surface -->
    <ellipse cx="400" cy="480" rx="245" ry="60" fill="url(#cakeTop)" stroke="#EFE9E0" stroke-width="1.5"/>

    <!-- ============================================== -->
    <!-- Authentic Handcrafted Gold Leaf Splatter       -->
    <!-- ============================================== -->
    <!-- Splatter Patches on Top Surface -->
    <path d="M 280,455 Q 320,445 350,470 Q 330,490 290,475 Z" fill="url(#goldMetallic)" opacity="0.85"/>
    <path d="M 370,440 Q 420,430 460,450 Q 430,470 380,455 Z" fill="url(#goldMetallic)" opacity="0.9"/>
    <path d="M 470,470 Q 520,455 540,480 Q 500,505 460,485 Z" fill="url(#goldMetallic)" opacity="0.8"/>
    <path d="M 330,485 Q 370,470 410,495 Q 380,515 340,500 Z" fill="url(#goldMetallic)" opacity="0.88"/>

    <!-- Splatter Streaks down the Side Wall -->
    <path d="M 180,510 C 200,550 190,620 220,680 C 210,650 205,580 190,520 Z" fill="url(#goldMetallic)" opacity="0.85"/>
    <path d="M 240,520 Q 270,610 260,700 Q 250,640 230,560 Z" fill="url(#goldMetallic)" opacity="0.9"/>
    <path d="M 300,540 C 330,600 320,680 340,730 C 330,680 315,620 295,550 Z" fill="url(#goldMetallic)" opacity="0.92"/>
    <path d="M 370,510 Q 400,600 420,710 Q 410,650 380,540 Z" fill="url(#goldMetallic)" opacity="0.88"/>
    <path d="M 440,530 C 470,600 480,670 470,725 C 460,670 455,590 430,545 Z" fill="url(#goldMetallic)" opacity="0.86"/>
    <path d="M 520,520 Q 550,610 570,690 Q 550,640 530,560 Z" fill="url(#goldMetallic)" opacity="0.85"/>
    <path d="M 580,540 C 610,600 620,660 610,705 C 600,660 595,610 575,555 Z" fill="url(#goldMetallic)" opacity="0.82"/>

    <!-- Droplets & Micro Flecks on Front Wall -->
    <circle cx="210" cy="540" r="3.5" fill="#D4AF37"/>
    <circle cx="230" cy="630" r="4" fill="#C9982E"/>
    <circle cx="270" cy="570" r="3" fill="#E5C068"/>
    <circle cx="320" cy="650" r="4.5" fill="#BF8D2C"/>
    <circle cx="350" cy="580" r="3" fill="#D4AF37"/>
    <circle cx="390" cy="660" r="5" fill="#C9982E"/>
    <circle cx="430" cy="600" r="3.5" fill="#E5C068"/>
    <circle cx="470" cy="670" r="4.5" fill="#BF8D2C"/>
    <circle cx="510" cy="590" r="3" fill="#D4AF37"/>
    <circle cx="550" cy="650" r="4" fill="#C9982E"/>
    <circle cx="590" cy="610" r="3" fill="#E5C068"/>

    <!-- Edible White Sugar Pearls -->
    <g id="whitePearls">
      <circle cx="220" cy="580" r="3.5" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="250" cy="640" r="3" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="280" cy="530" r="4" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="310" cy="600" r="3.5" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="340" cy="680" r="4" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="370" cy="560" r="3" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="410" cy="640" r="4.5" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="450" cy="570" r="3.5" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="480" cy="650" r="4" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="520" cy="580" r="3" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="540" cy="670" r="4" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      <circle cx="580" cy="630" r="3.5" fill="#FFFFFF" stroke="#D1CAC0" stroke-width="0.75"/>
      
      <!-- Pearls on top rim -->
      <circle cx="320" cy="460" r="3" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="0.5"/>
      <circle cx="360" cy="450" r="3.5" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="0.5"/>
      <circle cx="440" cy="455" r="3.5" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="0.5"/>
      <circle cx="490" cy="470" r="3" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="0.5"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- Top Left Cluster: Decorative Spheres / Balls   -->
  <!-- ============================================== -->
  <g id="topSpheresCluster" filter="url(#sphereShadow)">
    <!-- Back Gold Sphere -->
    <circle cx="215" cy="385" r="28" fill="url(#goldSphere)"/>
    <!-- Back White Sphere -->
    <circle cx="245" cy="345" r="26" fill="url(#whiteSphere)"/>
    <!-- Small Accent Gold -->
    <circle cx="178" cy="388" r="20" fill="url(#goldSphere)"/>
    <!-- Large Front White Sphere -->
    <circle cx="270" cy="405" r="38" fill="url(#whiteSphere)"/>
    <!-- Medium Front White Sphere -->
    <circle cx="205" cy="430" r="25" fill="url(#whiteSphere)"/>
    <!-- Medium Gold Sphere -->
    <circle cx="230" cy="325" r="24" fill="url(#goldSphere)"/>
  </g>

  <!-- ============================================== -->
  <!-- Bottom Right Cluster: Decorative Spheres/Balls -->
  <!-- ============================================== -->
  <g id="bottomSpheresCluster" filter="url(#sphereShadow)">
    <!-- White sphere base -->
    <circle cx="630" cy="740" r="34" fill="url(#whiteSphere)"/>
    <!-- Large Gold Metallic sphere -->
    <circle cx="590" cy="690" r="42" fill="url(#goldSphere)"/>
    <!-- Secondary White sphere -->
    <circle cx="655" cy="695" r="26" fill="url(#whiteSphere)"/>
    <!-- Small Bottom Gold sphere -->
    <circle cx="625" cy="775" r="18" fill="url(#goldSphere)"/>
  </g>

  <!-- ============================================== -->
  <!-- Laser-Cut Mirror Gold Acrylic Cake Topper      -->
  <!-- "Happy Birthday Sister NK"                     -->
  <!-- ============================================== -->
  <g id="acrylicTopper" filter="url(#topperGlow)">
    <!-- Clear Acrylic Anchor Stick -->
    <rect x="428" y="380" width="6" height="120" fill="#E8E2D8" opacity="0.6" rx="2"/>

    <!-- Gold Acrylic Topper Silhouette with Shiny Metallic Gradients -->
    <!-- "Happy Birthday" Calligraphy Script -->
    <g transform="translate(425, 290)">
      <!-- Drop Shadow on Topper -->
      <path d="M -110,-70 C -80,-95 -20,-95 20,-75 C 60,-95 110,-85 125,-60 C 135,-40 120,-20 90,-10 C 120,5 130,30 110,50 C 90,65 50,60 10,55 C -20,65 -70,60 -95,45 C -120,25 -115,-5 -85,-20 C -115,-35 -125,-55 -110,-70 Z" fill="#845A12" opacity="0.3" transform="translate(3, 4)"/>

      <!-- Topper Gold Metallic Backing Plate -->
      <path d="M -115,-70 C -85,-98 -15,-98 25,-78 C 65,-98 115,-88 130,-62 C 140,-42 125,-22 95,-12 C 125,3 135,28 115,48 C 95,63 55,58 15,53 C -15,63 -65,58 -90,43 C -115,23 -110,-7 -80,-22 C -110,-37 -120,-57 -115,-70 Z" fill="url(#goldMetallic)" stroke="#875F13" stroke-width="2.5"/>

      <!-- Typography Calligraphy: Happy Birthday -->
      <text x="0" y="-35" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', serif" font-weight="900" font-style="italic" font-size="52" fill="#5E3E07" letter-spacing="1">Happy</text>
      <text x="0" y="-37" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', serif" font-weight="900" font-style="italic" font-size="52" fill="url(#goldMetallic)" letter-spacing="1">Happy</text>
      
      <text x="5" y="15" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', serif" font-weight="900" font-style="italic" font-size="48" fill="#5E3E07" letter-spacing="1">Birthday</text>
      <text x="5" y="13" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', serif" font-weight="900" font-style="italic" font-size="48" fill="url(#goldMetallic)" letter-spacing="1">Birthday</text>

      <!-- Bold Topper Line: Sister NK -->
      <text x="8" y="68" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="54" fill="#5E3E07" letter-spacing="2">Sister NK</text>
      <text x="8" y="65" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="54" fill="#FFEAA7" letter-spacing="2">Sister NK</text>
      <text x="8" y="64" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="54" fill="url(#goldMetallic)" letter-spacing="2">Sister NK</text>

      <!-- Specular Highlight Glint on Acrylic -->
      <polygon points="-80,-65 -60,-65 -75,-40 -95,-40" fill="#FFFFFF" opacity="0.65"/>
      <polygon points="40,-60 65,-60 50,-35 25,-35" fill="#FFFFFF" opacity="0.6"/>
      <polygon points="-40,50 -20,50 -35,68 -55,68" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>

  <!-- Luxury Badge Bottom Watermark -->
  <g transform="translate(680, 930)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#E2DCD5" stroke-width="1.5" filter="url(#sphereShadow)"/>
    <text x="0" y="-4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#9E731B" letter-spacing="1">EL'S DELIGHT</text>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#C9982E">LAGOS</text>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="700" fill="#755212">HANDCRAFTED</text>
  </g>
</svg>
