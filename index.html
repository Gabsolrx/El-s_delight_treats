    <!-- Mobile & Browser Color Control -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <!-- Synchronous Theme Script to ensure clean light mode by default and dark mode on choice -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('els_theme');
          var isDark = saved === 'dark';
          var doc = document.documentElement;
          var metaTheme = document.getElementById('theme-color-meta');
          if (isDark) {
            doc.classList.add('dark');
            doc.setAttribute('data-theme', 'dark');
            if (metaTheme) metaTheme.setAttribute('content', '#0F0F12');
          } else {
            doc.classList.remove('dark');
            doc.setAttribute('data-theme', 'light');
            if (metaTheme) metaTheme.setAttribute('content', '#ffffff');
          }
        } catch(e) {}
      })();
    </script>
